# =============================================================================
# VSTL Imaging - dnsmasq PXE-only DHCP configuration
# =============================================================================
# This config makes dnsmasq hand out short DHCP leases only to PXE firmware
# requests. Normal Windows/Linux clients stay with the existing DHCP server.
#
# Why PXE-only DHCP instead of proxyDHCP?
# - The imaging server (10.255.0.75) is on a network that already has DHCP.
# - Running a general second DHCP server on the same broadcast domain can break
#   lease assignment for every machine on the network.
# - Older Dell Latitude / HP ProBook PXE firmware can receive proxyDHCP boot
#   metadata but fail to fetch the bootloader. A tiny PXEClient-only range puts
#   the IP lease, next-server, and bootfile in one path.
#
# Reference: dnsmasq.conf(5), tagged DHCP ranges and PXE BOOT.
# =============================================================================

# 1) IP-assignment role: PXE firmware only.
#    We do not run general DHCP for the bench network. The only active lease
#    range below is tagged to PXEClient firmware requests and to iPXE's second
#    DHCP pass, so normal Windows / Linux clients still use the existing
#    upstream DHCP server.
#
#    Older Dell Latitude firmware can receive proxy boot metadata but never
#    fetch the TFTP bootloader afterward. Giving PXE firmware a short VSTL
#    DHCP lease puts the IP address, next-server, and bootfile in the same
#    boot path and avoids that old-firmware timeout.
dhcp-match=set:vstl_pxe,option:vendor-class,PXEClient
dhcp-match=set:vstl_pxe,option:vendor-class,HW-Client
dhcp-match=set:normal_windows,option:vendor-class,MSFT 5.0
# Keep this PXE-only pool away from addresses already observed on the bench LAN.
# .251-.252 were occupied by other devices and exhausted the old two-address
# pool, causing Dell/HP firmware to fall through to F1 diagnostics before the
# updated iPXE script could be fetched.
dhcp-range=tag:vstl_pxe,10.255.0.80,10.255.0.89,255.255.255.0,2m
dhcp-option=tag:vstl_pxe,option:router,10.255.0.1
dhcp-option=tag:vstl_pxe,option:dns-server,10.255.0.1
# Do not answer normal Windows/Linux DHCP requests. Only tagged PXE/iPXE boot
# clients get a VSTL rescue lease.
dhcp-ignore=tag:!vstl_pxe
# Known old-Dell MAC prefixes are tagged for PXE/iPXE compatibility below.
# Do not let normal Windows renewals on those same NICs consume the tiny PXE
# pool or receive PXE bootfile metadata.
dhcp-ignore=tag:old_dell_uefi,tag:normal_windows

# The PXE range is tiny and reserved for firmware boots, so skip dnsmasq's
# pre-offer address probe. Older Dell Latitude firmware can time out if the
# imaging server waits ~3 seconds to ARP-check the lease before DHCPOFFER.
no-ping

# 2) Tell PXE clients where to fetch the boot file from (FOG's TFTP).
#    The IP MUST match the server hosting the FOG TFTP service (this host).
#
#    Keep boot filenames architecture-tagged so UEFI and BIOS clients never
#    receive the wrong NBP. Older Dell Latitude 5490-class UEFI firmware accepts
#    the DHCP offer but can stop before TFTP when dnsmasq also sends PXE service
#    menu metadata. Keep the handoff as plain DHCP bootfile/next-server fields.
#
#    Older/broken PXE ROMs can misread DHCP packets when dnsmasq moves the boot
#    server/filename fields into DHCP options to make room. Keep those fields
#    in the simple BOOTP locations, and accept alternate vendor-classes seen on
#    some vendor-customized PXE firmware.
dhcp-no-override
dhcp-pxe-vendor=PXEClient,HW-Client

# 3) Do NOT send dnsmasq PXE service/menu metadata here.
#    Dell Latitude 5490 UEFI PXE proved it will accept the VSTL DHCPACK and
#    then never request the TFTP NBP when active pxe-service lines are present.
#    The architecture-tagged dhcp-boot lines below are enough, and keep the
#    packet smaller and closer to what old firmware expects.

# 4) Architecture-specific boot file selection. Modern UEFI laptops need
#    a different boot loader than legacy BIOS PXE.
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi32,option:client-arch,6
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efix64,option:client-arch,9
dhcp-match=set:ipxe,175
# Some older/third-party iPXE builds do not expose option 175 consistently.
# They do send user-class "iPXE"; catch that second DHCP pass too so the
# upstream DHCP server cannot redirect them to 10.255.0.1/default.ipxe.
dhcp-userclass=set:ipxe,iPXE
# iPXE's second DHCP pass may not keep the original PXEClient vendor-class.
# Keep it inside the same tiny VSTL PXE-only lease range so the upstream DHCP
# server cannot win this pass and leave iPXE without a next-server value.
dhcp-match=set:vstl_pxe,175
dhcp-userclass=set:vstl_pxe,iPXE

# Prefer VSTL's PXE-only answer immediately when a bench is booting. This does
# not serve normal Windows/Linux clients because dhcp-ignore still blocks any
# request without the vstl_pxe tag.
dhcp-authoritative

# Known Dell Latitude onboard NIC prefixes seen on the bench. Keep them
# MAC-tagged so dnsmasq answers their second iPXE pass, but send them through
# the same generic SNP + boot.ipxe path as every other laptop. A separate
# old-Dell handoff made USB-C Ethernet behaviour model-specific again.
dhcp-mac=set:old_dell_uefi,10:65:30:*:*:*
dhcp-mac=set:vstl_pxe,10:65:30:*:*:*
# A second Latitude 5490 NIC family observed on the bench. Its iPXE second
# DHCP request omits both PXEClient vendor-class and option 175, so without a
# MAC-scoped VSTL tag dnsmasq ignores it and the upstream 10.255.0.1 server
# redirects it to default.ipxe.
dhcp-mac=set:old_dell_uefi,8c:04:ba:*:*:*
dhcp-mac=set:vstl_pxe,8c:04:ba:*:*:*
# A third Latitude 5490 NIC family seen in the 2026-06-21 chainload failure:
# iPXE started on e4:b9:7a:22:98:7f, lost the VSTL second DHCP pass, then
# followed the upstream 10.255.0.1/default.ipxe path and rebooted.
dhcp-mac=set:old_dell_uefi,e4:b9:7a:*:*:*
dhcp-mac=set:vstl_pxe,e4:b9:7a:*:*:*
# Additional Latitude 5490 NIC families seen in the 2026-06-21 post-deploy
# test. They stay MAC-tagged for the VSTL DHCP answer, but no longer receive a
# separate bootfile.
dhcp-mac=set:old_dell_uefi,98:e7:43:*:*:*
dhcp-mac=set:vstl_pxe,98:e7:43:*:*:*
dhcp-mac=set:old_dell_uefi,c8:f7:50:*:*:*
dhcp-mac=set:vstl_pxe,c8:f7:50:*:*:*
# Latitude 5490 BIOS 1.24.0 unit from the 2026-06-21 18:10 video reached
# iPXE as net0 34:48:ed:33:e5:f2 and then looped at "Configuring"; keep this
# Dell NIC family MAC-tagged for the VSTL DHCP answer too.
dhcp-mac=set:old_dell_uefi,34:48:ed:*:*:*
dhcp-mac=set:vstl_pxe,34:48:ed:*:*:*

dhcp-boot=tag:bios,pxelinux.0,vstl-imaging,10.255.0.75
dhcp-boot=tag:efi32,i386-efi/ipxe.efi,vstl-imaging,10.255.0.75
dhcp-boot=tag:old_dell_uefi,snponly.efi,vstl-imaging,10.255.0.75
# 64-bit UEFI benches use VSTL's embedded SNP-only loader, published under
# the firmware-friendly stock name `snponly.efi`. It reuses the network driver
# already initialized by laptop firmware, but chains directly to VSTL's HTTP
# boot.ipxe instead of the stock default.ipxe handoff.
dhcp-boot=tag:efi64,tag:!old_dell_uefi,snponly.efi,vstl-imaging,10.255.0.75
dhcp-boot=tag:efix64,tag:!old_dell_uefi,snponly.efi,vstl-imaging,10.255.0.75

# Mirror boot metadata in DHCP options 66/67/150 as well as BOOTP sname/file.
# Older Dell Latitude UEFI PXE explicitly requests these options and can stop
# before TFTP if only the BOOTP fields are populated. Once the first-stage EFI
# loader is already iPXE, stop sending TFTP loader options; iPXE should see only
# the HTTP script, otherwise it can keep re-running DHCP and never chain.
dhcp-option=tag:!ipxe,tag:vstl_pxe,option:tftp-server,10.255.0.75
dhcp-option=tag:!ipxe,tag:vstl_pxe,option:tftp-server-address,10.255.0.75
dhcp-option=tag:!ipxe,tag:bios,option:bootfile-name,pxelinux.0
dhcp-option=tag:!ipxe,tag:efi32,option:bootfile-name,i386-efi/ipxe.efi
dhcp-option=tag:!ipxe,tag:old_dell_uefi,option:bootfile-name,snponly.efi
dhcp-option=tag:!ipxe,tag:efi64,tag:!old_dell_uefi,option:bootfile-name,snponly.efi
dhcp-option=tag:!ipxe,tag:efix64,tag:!old_dell_uefi,option:bootfile-name,snponly.efi

# Once the first-stage EFI loader is iPXE, advertise the final HTTP script.
# Keep option 66/150 present because this iPXE build asks for them, but leave
# option 67 as the HTTP URL.
dhcp-boot=tag:ipxe,tag:old_dell_uefi,http://10.255.0.75/vstl-pxe/boot.ipxe,vstl-imaging,10.255.0.75
dhcp-boot=tag:ipxe,tag:!old_dell_uefi,http://10.255.0.75/vstl-pxe/boot.ipxe,vstl-imaging,10.255.0.75
dhcp-option=tag:ipxe,tag:old_dell_uefi,option:bootfile-name,http://10.255.0.75/vstl-pxe/boot.ipxe
dhcp-option=tag:ipxe,tag:!old_dell_uefi,option:bootfile-name,http://10.255.0.75/vstl-pxe/boot.ipxe
dhcp-option=tag:ipxe,option:tftp-server,10.255.0.75
dhcp-option=tag:ipxe,option:tftp-server-address,10.255.0.75

# 5) TFTP - FOG's tftpd-hpa already listens on port 69, so dnsmasq must NOT
#    try to bind it. The correct way is to omit enable-tftp entirely.
# enable-tftp deliberately not set

# 6) DNS-related options - disable, your existing infrastructure handles DNS.
port=0

# 7) Logging - useful while debugging, comment out for production.
log-dhcp
log-queries
